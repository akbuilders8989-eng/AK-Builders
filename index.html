<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ========================= -->
    <!-- FAVICON -->
    <!-- ========================= -->

    <!-- Main browser favicon -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <!-- PNG favicon - Google/Search -->
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon-48x48.png"
    />

    <!-- Browser favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <!-- Small browser favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <!-- Apple devices -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- ========================= -->
    <!-- MOBILE / PWA -->
    <!-- ========================= -->

    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <meta
      name="theme-color"
      content="#171716"
    />

    <!-- ========================= -->
    <!-- VIEWPORT -->
    <!-- ========================= -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ========================= -->
    <!-- SEO -->
    <!-- ========================= -->

    <meta
      name="description"
      content="AK BUILDERS provides residential and commercial construction, architecture, renovation, and remodeling services across Chennai and Tiruvallur, Tamil Nadu."
    />

    <link
      rel="canonical"
      href="https://ak-builders.in/"
    />

    <!-- ========================= -->
    <!-- OPEN GRAPH -->
    <!-- ========================= -->

    <meta
      property="og:title"
      content="AK BUILDERS | Premium Construction & Architecture in Chennai & Tiruvallur"
    />

    <meta
      property="og:description"
      content="AK BUILDERS provides residential and commercial construction, architecture, renovation, and remodeling services across Chennai and Tiruvallur, Tamil Nadu."
    />

    <meta
      property="og:url"
      content="https://ak-builders.in/"
    />

    <meta
      property="og:image"
      content="https://ak-builders.in/images/ak-logo.png"
    />

    <meta
      property="og:type"
      content="website"
    />

    <!-- ========================= -->
    <!-- TWITTER / X -->
    <!-- ========================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="AK BUILDERS | Premium Construction & Architecture in Chennai & Tiruvallur"
    />

    <meta
      name="twitter:description"
      content="AK BUILDERS provides residential and commercial construction, architecture, renovation, and remodeling services across Chennai and Tiruvallur, Tamil Nadu."
    />

    <meta
      name="twitter:image"
      content="https://ak-builders.in/images/ak-logo.png"
    />

    <!-- ========================= -->
    <!-- GOOGLE FONTS -->
    <!-- ========================= -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ========================= -->
    <!-- PAGE TITLE -->
    <!-- ========================= -->

    <title>
      AK BUILDERS | Premium Construction & Architecture in Chennai & Tiruvallur
    </title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
